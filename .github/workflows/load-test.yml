name: Nightly Load Test

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-locust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install locust
        run: python -m pip install locust
      - name: Run locust headless
        env:
          BASE_URL: ${{ secrets.MONITOR_BASE_URL }}
        run: |
          mkdir -p artifacts
          locust -f tests/locustfile.py --headless -u 50 -r 10 -t 5m --host "$BASE_URL" --csv=artifacts/locust_report || true
      - name: Upload locust artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: locust-artifacts
          path: artifacts
