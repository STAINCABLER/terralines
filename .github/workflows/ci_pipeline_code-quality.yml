name: Code Quality CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run ruff
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt
      - name: Run pip-audit (collect)
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt --format=json -o pip_audit.json || true
      - name: Upload pip-audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pip-audit
          path: pip_audit.json
          if-no-files-found: ignore
      - name: Fail on pip-audit vulnerabilities
        run: |
          python - <<'PY'
          import json,sys
          try:
            data=json.load(open('pip_audit.json'))
          except Exception:
            sys.exit(0)
          vulns=[
            (dep.get('name'), dep.get('version'), vuln.get('id'))
            for dep in data.get('dependencies', [])
            for vuln in dep.get('vulns', [])
          ]
          if vulns:
            print('pip-audit found vulnerabilities:')
            print(json.dumps(vulns, indent=2))
            sys.exit(1)
          else:
            print('No vulnerabilities found by pip-audit')
            sys.exit(0)
          PY
      - name: Run tests with coverage
        run: |
          python -m pytest --maxfail=1 --disable-warnings --cov=app --cov-report=xml --cov-report=term-missing --cov-fail-under=70
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore

  build:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: ltm_ptb_terralines:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Generate SBOM (Anchore SBOM Action)
        uses: anchore/sbom-action@v0
        with:
          image: ltm_ptb_terralines:ci
          output-file: sbom.json
      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.json

  scan:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build image for Trivy scan
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: ltm_ptb_terralines:ci
          cache-from: type=gha
      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ltm_ptb_terralines:ci
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
