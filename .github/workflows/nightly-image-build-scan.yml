name: Nightly Image Build Scan

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-scan-nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build nightly image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: ghcr.io/${{ github.repository_owner }}/ltm_ptb_terralines:nightly-${{ github.run_id }}
      - name: Run container health checks
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/ltm_ptb_terralines:nightly-${{ github.run_id }}
          CONTAINER=terralines-nightly-${{ github.run_id }}
          docker run -d --name $CONTAINER -p 8000:8000 $IMAGE
          healthy=false
          for i in $(seq 1 30); do
            if curl -fS --max-time 2 http://127.0.0.1:8000/health >/dev/null 2>&1 || curl -fS --max-time 2 http://127.0.0.1:8000/ >/dev/null 2>&1; then
              healthy=true; break
            fi
            sleep 2
          done
          docker logs $CONTAINER > health_container.log || true
          docker stop $CONTAINER || true
          docker rm $CONTAINER || true
          if [ "$healthy" != "true" ]; then
            echo "Health check failed"; cat health_container.log || true; exit 1
          fi
      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository_owner }}/ltm_ptb_terralines:nightly-${{ github.run_id }}
          output-file: sbom_nightly.json
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/ltm_ptb_terralines:nightly-${{ github.run_id }}
          format: json
          output: trivy_nightly_report.json
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
      - name: Push nightly image to GHCR
        run: docker push ghcr.io/${{ github.repository_owner }}/ltm_ptb_terralines:nightly-${{ github.run_id }}
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-artifacts
          path: |
            sbom_nightly.json
            trivy_nightly_report.json
