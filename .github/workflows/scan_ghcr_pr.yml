name: PR Image Scan GHCR

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  packages: write

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build PR image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: ghcr.io/staincabler/ltm_ptb_terralines:pr-${{ github.event.pull_request.number }}-${{ github.sha }}
      - name: Container health check
        uses: ./.github/actions/container-health-check
        with:
          image: ghcr.io/staincabler/ltm_ptb_terralines:pr-${{ github.event.pull_request.number }}-${{ github.sha }}
          container_name: terralines-pr-${{ github.event.pull_request.number }}-${{ github.sha }}
          port: '8000'
          retries: '30'
          interval: '2'
      - name: Upload health check logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: health-check-log
          path: health_container.log
          if-no-files-found: ignore
      - name: Scan image with Trivy (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/staincabler/ltm_ptb_terralines:pr-${{ github.event.pull_request.number }}-${{ github.sha }}
          format: json
          output: trivy_pr_report.json
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
      - name: Push PR image to GHCR
        run: docker push ghcr.io/staincabler/ltm_ptb_terralines:pr-${{ github.event.pull_request.number }}-${{ github.sha }}
      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-pr-report
          path: trivy_pr_report.json
