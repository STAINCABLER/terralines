name: Functionality Checks

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall app.py generator.py tests/test_app.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build container image
        run: docker build -t ltm_ptb_terralines:ci .

      - name: Start container (no host port mapping)
        run: |
          # Start the container without publishing a host port to avoid port-allocation conflicts
          docker run -d --name terralines-ci ltm_ptb_terralines:ci

      - name: Smoke test container (exec inside container)
        run: |
          set -o pipefail

          # wait for the server inside the container to respond
          for i in $(seq 1 60); do
            docker exec terralines-ci sh -c "curl -fsS http://127.0.0.1:8000/" > /tmp/terralines-index.html 2> /tmp/terralines-curl.log && break || true
            sleep 1
          done

          if ! grep -q "Topografischer Mustergenerator" /tmp/terralines-index.html; then
            echo "=== Index check failed; showing curl output (truncated) ==="
            sed -n '1,200p' /tmp/terralines-curl.log || true
            echo "=== Docker container logs ==="
            docker logs terralines-ci --since 1m || true
            echo "=== Container inspect ==="
            docker inspect terralines-ci --format '{{json .State}}' || true
            echo "=== /tmp/terralines-index.html (if present) ==="
            sed -n '1,200p' /tmp/terralines-index.html || true
            exit 1
          fi

          grep -q "made by Tobias Maimone of LTM-Labs" /tmp/terralines-index.html
          grep -q "ltm-labs.de" /tmp/terralines-index.html

      - name: Stop container
        if: always()
        run: |
          docker rm -f terralines-ci || true
