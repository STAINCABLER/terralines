name: Monitoring - Synthetic Checks

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Base URL to test (overrides secret MONITOR_BASE_URL)'
        required: false
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: read

jobs:
  synthetic-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y curl jq
      - name: Run synthetic checks
        env:
          BASE_URL: ${{ github.event.inputs.url || secrets.MONITOR_BASE_URL }}
        run: |
          if [ -z "$BASE_URL" ]; then
            echo "BASE_URL not set. Provide input 'url' or set secret MONITOR_BASE_URL"; exit 1
          fi
          echo "Testing $BASE_URL"
          curl -fS --max-time 15 "$BASE_URL/" -o /tmp/monitor_root.html
          curl -fS --max-time 10 "$BASE_URL/health" -o /tmp/monitor_health.txt
          echo "root size:" $(wc -c < /tmp/monitor_root.html)
          echo "health content:"
          cat /tmp/monitor_health.txt
      - name: Upload monitoring artifacts
        uses: actions/upload-artifact@v4
        with:
          name: monitoring-artifacts
          path: |
            /tmp/monitor_root.html
            /tmp/monitor_health.txt
