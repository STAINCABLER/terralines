name: Release Image

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run pip-audit (collect)
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit
          pip-audit -r requirements.txt --format=json -o pip_audit.json || true
      - name: Upload pip-audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit
          path: pip_audit.json
      - name: Fail on pip-audit vulnerabilities
        run: |
          python - <<'PY'
import json,sys
try:
    data=json.load(open('pip_audit.json'))
except Exception:
    sys.exit(0)
if len(data)>0:
    print('pip-audit found vulnerabilities:')
    print(json.dumps(data, indent=2))
    sys.exit(1)
else:
    print('No vulnerabilities found by pip-audit')
    sys.exit(0)
PY
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: Build and push image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USER }}/terralines:latest
      - name: Generate SBOM (Syft)
        uses: anchore/syft-action@v2
        with:
          image: ${{ secrets.DOCKERHUB_USER }}/terralines:latest
          output: sbom.json
      - name: Upload SBOM as Release asset
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./sbom.json
          asset_name: sbom.json
          asset_content_type: application/json
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v1
        with:
          image-ref: ${{ secrets.DOCKERHUB_USER }}/terralines:latest
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
      - name: Install cosign
        uses: sigstore/cosign-installer@v2
      - name: Sign image with cosign (keyless)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cosign sign --keyless ${{ secrets.DOCKERHUB_USER }}/terralines:latest
