name: Functionality Checks

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall app.py generator.py tests/test_app.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build container image
        run: docker build -t ltm_ptb_terralines:ci .

      - name: Start container
        run: docker run -d --rm --name terralines-ci -p 8000:8000 ltm_ptb_terralines:ci

      - name: Smoke test container
        run: |
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8000/ >/tmp/terralines-index.html; then
              break
            fi
            sleep 1
          done

          grep -q "Topografischer Mustergenerator" /tmp/terralines-index.html
          grep -q "made by Tobias Maimone of LTM-Labs" /tmp/terralines-index.html
          grep -q "ltm-labs.de" /tmp/terralines-index.html

      - name: Stop container
        if: always()
        run: docker rm -f terralines-ci
