name: Nightly Image Build Scan

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-scan-nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push nightly image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/terralines:nightly-${{ github.run_id }}
      - name: Generate SBOM (Syft)
          uses: anchore/sbom-action@v0
          with:
            image: ghcr.io/${{ github.repository_owner }}/terralines:nightly-${{ github.run_id }}
            output-file: sbom.json
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v1
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/terralines:nightly-${{ github.run_id }}
          format: json
          output: trivy_nightly_report.json
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-artifacts
          path: |
            sbom_nightly.json
            trivy_nightly_report.json
