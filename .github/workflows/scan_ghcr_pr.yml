name: PR Image Scan GHCR

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  packages: write

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build PR image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: ghcr.io/${{ github.repository_owner }}/ltm_ptb_terralines:pr-${{ github.event.pull_request.number }}-${{ github.sha }}
      - name: Run container health checks
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/ltm_ptb_terralines:pr-${{ github.event.pull_request.number }}-${{ github.sha }}
          CONTAINER=terralines-pr-${{ github.event.pull_request.number }}-${{ github.sha }}
          docker run -d --name $CONTAINER -p 8000:8000 $IMAGE
          healthy=false
          for i in $(seq 1 30); do
            if curl -fS --max-time 2 http://127.0.0.1:8000/health >/dev/null 2>&1 || curl -fS --max-time 2 http://127.0.0.1:8000/ >/dev/null 2>&1; then
              healthy=true; break
            fi
            sleep 2
          done
          docker logs $CONTAINER > health_container.log || true
          docker stop $CONTAINER || true
          docker rm $CONTAINER || true
          if [ "$healthy" != "true" ]; then
            echo "Health check failed"; cat health_container.log || true; exit 1
          fi
      - name: Scan image with Trivy (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/ltm_ptb_terralines:pr-${{ github.event.pull_request.number }}-${{ github.sha }}
          format: json
          output: trivy_pr_report.json
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
      - name: Push PR image to GHCR
        run: docker push ghcr.io/${{ github.repository_owner }}/ltm_ptb_terralines:pr-${{ github.event.pull_request.number }}-${{ github.sha }}
      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-pr-report
          path: trivy_pr_report.json
