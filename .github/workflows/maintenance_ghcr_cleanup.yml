name: GHCR Cleanup

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only list candidates, do not delete them'
        required: false
        default: 'false'
      days:
        description: 'Threshold in days to consider old images'
        required: false
        default: '7'

permissions:
  contents: read
  packages: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Cleanup old PR/Nightly images in GHCR
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const packageNames = ['ltm_ptb_terralines', 'terralines'];
            const dryRun = (context.payload.inputs?.dry_run ?? 'false') === 'true';
            const thresholdDays = parseInt(context.payload.inputs?.days ?? '7', 10);
            const cutoff = new Date(Date.now() - thresholdDays * 24 * 60 * 60 * 1000);
            const candidates = [];
            const deleted = [];
            let isOrg = true;
            try {
              await github.rest.orgs.get({ org: owner });
            } catch (e) {
              isOrg = false;
            }
            for (const packageName of packageNames) {
              let versions = [];
              try {
                if (isOrg) {
                  const resp = await github.rest.packages.listPackageVersionsForPackageOwnedByOrg({ org: owner, package_type: 'container', package_name: packageName, per_page: 100 });
                  versions = resp.data || [];
                } else {
                  const resp = await github.request('GET /users/{username}/packages/container/{package_name}/versions', {
                    username: owner,
                    package_name: packageName,
                    per_page: 100
                  });
                  versions = resp.data || [];
                }
              } catch (e) {
                if (e.status === 404) {
                  core.warning(`Package '${packageName}' not found for owner '${owner}', skipping`);
                  continue;
                }
                throw e;
              }
              for (const v of versions) {
                const created = new Date(v.created_at);
                const tags = (v.metadata && v.metadata.container && v.metadata.container.tags) || [];
                const isPrOrNightly = tags.some(t => t.startsWith('pr-') || t.startsWith('nightly-'));
                if (isPrOrNightly && created < cutoff) {
                  const item = { packageName, id: v.id, created_at: v.created_at, tags };
                  candidates.push(item);
                  if (!dryRun) {
                    if (isOrg) {
                      await github.rest.packages.deletePackageVersionForOrg({ org: owner, package_type: 'container', package_name: packageName, package_version_id: v.id });
                    } else {
                      await github.request('DELETE /users/{username}/packages/container/{package_name}/versions/{package_version_id}', {
                        username: owner,
                        package_name: packageName,
                        package_version_id: v.id
                      });
                    }
                    deleted.push(item);
                  }
                }
              }
            }
            if (dryRun) {
              const out = { thresholdDays, cutoff: cutoff.toISOString(), candidates };
              fs.writeFileSync('./ghcr_cleanup_dryrun.json', JSON.stringify(out, null, 2));
              core.setOutput('count', candidates.length);
              core.info(`Dry-run found ${candidates.length} package versions`);
              return out;
            }
            core.info(`Deleted ${deleted.length} package versions`);
            return { deleted };
      - name: Upload dry-run report
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ghcr-cleanup-dryrun
          path: ghcr_cleanup_dryrun.json
          if-no-files-found: ignore
