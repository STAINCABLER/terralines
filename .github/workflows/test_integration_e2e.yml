name: E2E Compose Integration

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      docker:
        image: docker:24-dind
        options: --privileged
    steps:
      - uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Pull images and start services via docker-compose
        run: |
          # Pull images from registry (don't build in CI E2E)
          docker compose pull || true
          docker compose up -d
      - name: Install CLI deps (jq, curl)
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl
      - name: Wait for services (web, redis)
        run: |
          set -e
          # wait for web
          for i in $(seq 1 30); do
            if curl -sS --fail http://localhost:8000/ >/dev/null; then echo web ready && break; fi
            echo "waiting for web... ($i)"; sleep 2
          done
          # wait for redis
          for i in $(seq 1 30); do
            if docker exec $(docker ps -qf "name=redis") sh -c "echo PING | nc -w 1 localhost 6379" >/dev/null 2>&1; then echo redis ready && break; fi
            echo "waiting for redis... ($i)"; sleep 2
          done
      - name: Trigger RQ job and poll with backoff
        run: |
          set -euo pipefail
          # enqueue an RQ job (assumes /api/generate_rq exists)
          # Use small params to keep generation fast in CI
          PAYLOAD='{"params":{"width":320,"height":180,"preview_scale":0.5}}'
          echo "Enqueue payload: $PAYLOAD"
          RESP=$(curl -sS -X POST -H "Content-Type: application/json" -d "$PAYLOAD" http://localhost:8000/api/generate_rq)
          echo "Enqueue response: $RESP"
          JOB_ID=$(echo "$RESP" | jq -r '.job_id // empty')
          if [ -z "$JOB_ID" ]; then echo "Failed to enqueue job: $RESP"; exit 1; fi
          echo "Enqueued job: $JOB_ID"

          # poll with exponential backoff (max ~10 minutes)
          attempt=0
          delay=1
          STATUS=""
          while [ $attempt -lt 12 ]; do
            FULL=$(curl -sS http://localhost:8000/api/rq/job/${JOB_ID} || true)
            echo "job status response: $FULL"
            STATUS=$(echo "$FULL" | jq -r '.status // empty' || true)
            echo "status=$STATUS (attempt=$attempt)"
            if [ "$STATUS" = "finished" ]; then echo job finished && break; fi
            if [ "$STATUS" = "failed" ]; then
              ERR=$(echo "$FULL" | jq -r '.error // empty' || true)
              echo "Job failed with error: $ERR"
              exit 2
            fi
            attempt=$((attempt+1))
            sleep $delay
            delay=$((delay*2))
          done
          if [ "$STATUS" != "finished" ]; then echo "Job did not finish in time (last status=$STATUS)"; exit 3; fi
      - name: Assert result download
        run: |
          set -e
          curl -sS -o result.png http://localhost:8000/api/job/${JOB_ID}/download
          if [ ! -s result.png ]; then echo "Result file empty"; exit 3; fi
      - name: Upload artifacts (result + logs)
        if: always()
        run: |
          mkdir -p artifacts
          if [ -f result.png ]; then mv result.png artifacts/result.png; fi
          docker compose logs > artifacts/compose.log || true
          # collect individual container logs for better diagnostics
          docker ps --format '{{.Names}}' > artifacts/containers.txt || true
          if docker ps -qf "name=terralines-worker" >/dev/null 2>&1; then docker logs $(docker ps -qf "name=terralines-worker") > artifacts/worker.log || true; fi || true
          if docker ps -qf "name=redis" >/dev/null 2>&1; then docker logs $(docker ps -qf "name=redis") > artifacts/redis.log || true; fi || true
          if docker ps -qf "name=terralines-ui" >/dev/null 2>&1; then docker logs $(docker ps -qf "name=terralines-ui") > artifacts/web.log || true; fi || true
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: artifacts/
      - name: Tear down
        run: docker compose down -v || true
